<!DOCTYPE html>
<html>
<head>
    <title>Conversor de Temperatura</title>
</head>
<body>

    <h1>Conversor de Temperatura</h1>

    <input type="number" id="temperatura" placeholder="Digite a temperatura">

    <select id="tipo">
        <option value="C">Celsius para Fahrenheit</option>
        <option value="F">Fahrenheit para Celsius</option>
    </select>

    <button onclick="converter()">Converter</button>

    <p id="resultado"></p>

    <script>
        function converter() {
            let temperatura = document.getElementById("temperatura").value;
            let tipo = document.getElementById("tipo").value;
            let resultado;

            if (tipo === "C") {
                resultado = (temperatura * 9/5) + 32;
                document.getElementById("resultado").innerHTML =
                    temperatura + " °C = " + resultado + " °F";
            } else {
                resultado = (temperatura - 32) * 5/9;
                document.getElementById("resultado").innerHTML =
                    temperatura + " °F = " + resultado + " °C";
            }
        }
    </script>

</body>
</html>
